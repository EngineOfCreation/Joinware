<svg viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Define style and gradients -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8844;stop-opacity:1" />
    </linearGradient>
    <style>
      .joinware-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>
  
  <!-- Logo icon - dynamic geometric shapes -->
  <g transform="translate(10, 20)">
    <!-- Central circle with gradient -->
    <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" opacity="0.95"/>
    
    <!-- Geometric accent shapes -->
    <circle cx="28" cy="12" r="6" fill="#ff6b1a" opacity="0.7"/>
    <circle cx="12" cy="28" r="5" fill="#ff6b1a" opacity="0.6"/>
    <rect x="14" y="14" width="12" height="12" fill="#ff6b1a" opacity="0.5" rx="2"/>
  </g>
  
  <!-- Text "Joinware" -->
  <text x="60" y="48" class="joinware-text" fill="#09111f">Joinware</text>
</svg>